openapi: 3.0.3
info:
  title: KLik API
  version: 1.0.0
  description: KLik API
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTokenObtainPair'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/branches/:
    get:
      operationId: branches_list
      description: GET /api/branches/ — список всех филиалов
      tags:
      - branches
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'
          description: ''
  /api/branches/{id}/:
    get:
      operationId: branches_retrieve
      description: GET /api/branches/ — список всех филиалов
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Филиал.
        required: true
      tags:
      - branches
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
  /api/categories/:
    get:
      operationId: categories_list
      tags:
      - categories
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/categories/{id}/:
    get:
      operationId: categories_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Категория.
        required: true
      tags:
      - categories
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/clients/:
    get:
      operationId: clients_list
      description: |-
        Возвращает список студентов с поддержкой пагинации.

        **Правила доступа:**
        - **Старший тьютор / Старший менеджер:** видит ВСЕХ студентов.
        - **Менеджер:** видит студентов только своего филиала.
        - **Тьютор:** видит только студентов своих групп.
      summary: Получить список студентов
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - clients
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStudentList'
          description: ''
  /api/clients/{id}/:
    get:
      operationId: clients_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Студент.
        required: true
      tags:
      - clients
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
          description: ''
  /api/clients/all/:
    get:
      operationId: clients_all_retrieve
      tags:
      - clients
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
          description: ''
  /api/groups/:
    get:
      operationId: groups_list
      description: |-
        Возвращает список групп с поддержкой пагинации.

        **Правила доступа:**
        - **Старший тьютор / Старший менеджер:** видит ВСЕ группы.
        - **Менеджер:** видит группы только своего филиала.
        - **Тьютор:** видит только свои группы.
      summary: Получить список групп
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - groups
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGroupList'
          description: ''
  /api/groups/{id}/:
    get:
      operationId: groups_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Группа.
        required: true
      tags:
      - groups
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: ''
  /api/groups/{id}/clients/:
    get:
      operationId: groups_clients_list
      description: Возвращает список всех студентов, привязанных к указанной группе.
      summary: Получить список студентов группы
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Группа.
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - groups
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStudentList'
          description: ''
  /api/locations/:
    get:
      operationId: locations_list
      description: Возвращает список всех локаций. Если передан `branch_id` — возвращаются
        только локации этого филиала.
      summary: Получить весь список локаций или список локаций конкретного филиала
      parameters:
      - in: query
        name: branch_id
        schema:
          type: integer
        description: ID филиала для фильтрации локаций.
      tags:
      - locations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
          description: ''
  /api/locations/{id}/:
    get:
      operationId: locations_retrieve
      description: |-
        GET /api/locations/ — все локации.
        GET /api/locations/?branch_id=<id> — локации конкретного филиала.
      summary: Получить локацию по ID
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID локации (location_id)
        required: true
      tags:
      - locations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
          description: ''
  /api/modules/:
    get:
      operationId: modules_list
      tags:
      - modules
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Module'
          description: ''
  /api/modules/{id}/:
    get:
      operationId: modules_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Модуль.
        required: true
      tags:
      - modules
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
          description: ''
  /api/news/:
    get:
      operationId: news_list
      tags:
      - news
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/News'
          description: ''
  /api/news/{id}/:
    get:
      operationId: news_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Новость.
        required: true
      tags:
      - news
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/News'
          description: ''
  /api/profile/detail/:
    get:
      operationId: profile_detail_retrieve
      description: Информация о текущем пользователе (зависит от роли — Manager или
        TutorProfile).
      tags:
      - profile
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/resumes/:
    get:
      operationId: resumes_list
      description: |-
        Возвращает список резюме с поддержкой пагинации.

        **Правила доступа:**
        - **Старший тьютор / Старший менеджер:** видит ВСЕ резюме.
        - **Менеджер:** видит резюме только студентов своего филиала.
        - **Тьютор:** видит резюме только студентов своих групп.
      summary: Получить список резюме
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - resumes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResumeList'
          description: ''
    post:
      operationId: resumes_create
      tags:
      - resumes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResumeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResumeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resume'
          description: ''
  /api/resumes/{id}/:
    get:
      operationId: resumes_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Резюме.
        required: true
      tags:
      - resumes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resume'
          description: ''
    put:
      operationId: resumes_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Резюме.
        required: true
      tags:
      - resumes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResumeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResumeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resume'
          description: ''
    patch:
      operationId: resumes_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Резюме.
        required: true
      tags:
      - resumes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedResumeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedResumeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedResumeRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resume'
          description: ''
    delete:
      operationId: resumes_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Резюме.
        required: true
      tags:
      - resumes
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/resumes/{id}/verify/:
    post:
      operationId: resumes_verify_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Резюме.
        required: true
      tags:
      - resumes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResumeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResumeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resume'
          description: ''
  /api/resumes/client/:
    get:
      operationId: resumes_client_retrieve
      tags:
      - resumes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resume'
          description: ''
  /api/reviews/:
    post:
      operationId: reviews_create
      tags:
      - reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParentReviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ParentReviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ParentReviewRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentReview'
          description: ''
  /api/reviews/{student_crm_id}/:
    get:
      operationId: reviews_list
      description: |-
        Возвращает список отзывов с поддержкой пагинации.

        **Правила доступа:**
        - **Старший тьютор / Старший менеджер:** видит ВСЕ отзывы.
        - **Менеджер:** видит отзывы только студентов своего филиала.
        - **Тьютор:** видит отзывы только студентов своих групп.
      summary: Получить список отзывов родителей
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: student_crm_id
        schema:
          type: string
        required: true
      tags:
      - reviews
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedParentReviewList'
          description: ''
components:
  schemas:
    Branch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Название
          maxLength: 255
        branch_crm_id:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: ID филиала в CRM
      required:
      - branch_crm_id
      - id
      - name
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Название категории
          maxLength: 255
        is_active:
          type: boolean
          title: Активна
        subcategories:
          type: array
          items: {}
          readOnly: true
      required:
      - id
      - name
      - subcategories
    CustomTokenObtainPair:
      type: object
      properties:
        phone_number:
          type: string
      required:
      - phone_number
    CustomTokenObtainPairRequest:
      type: object
      properties:
        phone_number:
          type: string
          minLength: 1
      required:
      - phone_number
    Group:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        crm_group_id:
          type: string
          title: ID группы из CRM
          maxLength: 100
        name:
          type: string
          title: Название группы
          maxLength: 255
        location:
          type: integer
          nullable: true
          title: Локация
        branch:
          type: integer
          title: Филиал
        tutor:
          type: integer
          nullable: true
          title: Тьютор
        total_students:
          type: integer
          readOnly: true
        resumes_written_count:
          type: integer
          readOnly: true
        resumes_verified_count:
          type: integer
          readOnly: true
      required:
      - branch
      - crm_group_id
      - id
      - name
      - resumes_verified_count
      - resumes_written_count
      - total_students
    Location:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Название локации
          maxLength: 255
        location_crm_id:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          title: ID локации в CRM
        branch:
          type: integer
          title: Филиал
        is_active:
          type: boolean
          title: Активна
      required:
      - branch
      - id
      - name
    Module:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Название модуля
          maxLength: 255
        validity_period:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: Период действия (дни)
        is_active:
          type: boolean
          title: Активен
        is_accessible:
          type: boolean
          readOnly: true
        lessons:
          type: array
          items: {}
          readOnly: true
      required:
      - id
      - is_accessible
      - lessons
      - name
    News:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Заголовок
          maxLength: 255
        content:
          type: string
          title: Контент
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Создано
      required:
      - content
      - created_at
      - id
      - title
    PaginatedGroupList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Group'
    PaginatedParentReviewList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ParentReview'
    PaginatedResumeList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Resume'
    PaginatedStudentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Student'
    ParentReview:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        student:
          type: integer
          readOnly: true
        content:
          type: string
          title: Текст отзыва
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Создано
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Обновлено
      required:
      - content
      - created_at
      - id
      - student
      - updated_at
    ParentReviewRequest:
      type: object
      properties:
        student_crm_id:
          type: string
          writeOnly: true
          minLength: 1
        content:
          type: string
          minLength: 1
          title: Текст отзыва
      required:
      - content
      - student_crm_id
    PatchedResumeRequest:
      type: object
      properties:
        student_crm_id:
          type: string
          writeOnly: true
          minLength: 1
        content:
