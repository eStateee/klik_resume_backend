services:
  db:
    image: postgres:15-alpine
    # Только с самого сервера: наружу Postgres выставлять не нужно —
    # к нему обращается только backend по внутренней сети compose.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    restart: always

  redis:
    image: redis:7-alpine
    # Redis без пароля — публиковать его наружу нельзя: в нём лежат
    # токен CRM и брокер Celery.
    ports:
      - "127.0.0.1:6379:6379"
    restart: always

  backend:
    build: ./backend
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn _settings.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - static_volume:/app/static
      - media_volume:/app/media
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - backend
    restart: always

  celery_worker:
    build: ./backend
    command: celery -A _settings worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: always

  celery_beat:
    build: ./backend
    command: celery -A _settings beat --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: always

  flower:
    build: ./backend
    command: celery -A _settings flower --port=5555
    # Flower показывает и позволяет отменять задачи, поэтому наружу не выводим:
    # доступ через SSH-туннель. Если публикация нужна — задайте
    # FLOWER_BASIC_AUTH=логин:пароль в .env.
    ports:
      - "127.0.0.1:5555:5555"
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
    depends_on:
      - redis
      - celery_worker
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume:
